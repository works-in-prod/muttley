[package]
name = "muttley"
version = "0.1.0"
edition = "2024"
description = "Small, local-first utilities for repetitive engineering chores"
repository = "https://github.com/works-in-prod/muttley"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
